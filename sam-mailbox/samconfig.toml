# Shared SAM CLI defaults for the mailbox stack — NON-PERSONAL ONLY.
#
# Operator-specific values (AWS profile, stack-name suffix, DomainName,
# HostedZoneId, MailboxSalt, WitnessAid, WitnessUrl) are NOT in this file.
# Pass them at deploy time:
#
#   AWS_PROFILE=<your-profile> sam deploy \
#     --stack-name serverless-mailbox-<label> \
#     --parameter-overrides \
#         MailboxName=mailbox-<label> \
#         DomainName=mailbox.<your-domain> \
#         HostedZoneId=Z... \
#         MailboxSalt=0A...
#
# For repeated personal use, copy this to `samconfig.local.toml` (gitignored)
# and add `profile = "..."`, `stack_name = "..."`, etc. Then deploy with
# `sam deploy --config-file samconfig.local.toml`.

version = 0.1

[default.deploy.parameters]
resolve_s3 = true
s3_prefix = "serverless-mailbox"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
image_repositories = []

[default.build.parameters]
use_container = false
