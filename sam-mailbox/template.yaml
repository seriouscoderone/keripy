AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  KERI Mailbox Service - Serverless mailbox running on AWS Lambda + DynamoDB.
  Accepts /fwd exn deposits, serves qry r=/mbx polls as SSE long-poll via
  API Gateway response streaming. Mailbox AID is witnessed by the
  sam-witness stack (witness.keri.host). Uses a container image (Python 3.14+).

Globals:
  Function:
    Timeout: 870           # under the 15-min streaming hard cap (900s)
    MemorySize: 1024
    Architectures:
      - arm64
  Api:
    OpenApiVersion: 3.0.1  # suppresses SAM's extra implicit Stage resource
    EndpointConfiguration:
      Type: REGIONAL        # REQUIRED — Edge-optimized caps idle at 30s
    BinaryMediaTypes:
      - application/cesr
      - "*/*"

Parameters:
  MailboxName:
    Type: String
    Default: mailbox
    Description: Base name for mailbox databases and resources
  MailboxSalt:
    Type: String
    NoEcho: true
    Description: qb64-encoded salt for deterministic AID across cold starts (required)
  MailboxAlias:
    Type: String
    Default: mailbox
    Description: Alias for the mailbox Hab
  DomainName:
    Type: String
    Default: mailbox.keri.host
    Description: Custom domain name for the mailbox API
  HostedZoneId:
    Type: String
    Default: Z0070723WLKQKTOACN5H
    Description: Route53 hosted zone ID for DNS validation
  WitnessAid:
    Type: String
    Default: BNbRfMPQQge6wKO0uof9Y0e_QYOfiF08k9drc6pOgzjt
    Description: AID of the witness that witnesses this mailbox AID
  WitnessUrl:
    Type: String
    Default: https://witness.keri.host
    Description: Base URL of the witness service (Lambda composes /oobi/<aid>/controller and /receipts)

Resources:
  # -----------------------------------------------------------------------
  # DynamoDB tables
  # -----------------------------------------------------------------------

  # DynamoDB table for Baser + Mailboxer (shared - non-overlapping subkeys)
  MailboxBaserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${MailboxName}-db"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: gsi_pk
          AttributeType: S
        - AttributeName: gsi_sk
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: subdb-index
          KeySchema:
            - AttributeName: gsi_pk
              KeyType: HASH
            - AttributeName: gsi_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # DynamoDB table for Keeper (private keys)
  MailboxKeeperTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${MailboxName}-ks"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: gsi_pk
          AttributeType: S
        - AttributeName: gsi_sk
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: subdb-index
          KeySchema:
            - AttributeName: gsi_pk
              KeyType: HASH
            - AttributeName: gsi_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # -----------------------------------------------------------------------
  # API Gateway (Approach A: SAM implicit via Events: + DefinitionBody
  # OpenAPI override to swap the integration URI to
  # /response-streaming-invocations at API version 2021-11-15).
  # -----------------------------------------------------------------------

  MailboxApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL
      # The DefinitionBody overrides SAM's default buffered integration URI
      # with the streaming variant.  SAM still auto-generates Deployment,
      # Stage, and Lambda::Permission resources from the Events: block on
      # MailboxFunction — we are only overriding the x-amazon-apigateway-
      # integration URI here.
      #
      # Two catch-all paths cover every route the Falcon app serves:
      #   /          — root (POST, PUT, GET for CESR ingest and status)
      #   /{proxy+}  — all sub-paths (/oobi/..., /receipts, etc.)
      #
      # The streaming URI suffix is /response-streaming-invocations and the
      # API version is 2021-11-15 (NOT /invocations at 2015-03-31).
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: mailbox-api
          version: "1.0"
        paths:
          /:
            x-amazon-apigateway-any-method:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub: >-
                    arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${MailboxFunction.Arn}/response-streaming-invocations
                passthroughBehavior: when_no_match
          /{proxy+}:
            x-amazon-apigateway-any-method:
              parameters:
                - name: proxy
                  in: path
                  required: true
                  schema:
                    type: string
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub: >-
                    arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${MailboxFunction.Arn}/response-streaming-invocations
                passthroughBehavior: when_no_match

  # -----------------------------------------------------------------------
  # Lambda function (ARM64 container image, LWA streaming)
  # -----------------------------------------------------------------------

  MailboxFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${MailboxName}-handler"
      PackageType: Image
      ImageUri: !Sub "${MailboxName}-handler:latest"
      Description: KERI Mailbox Lambda handler (Python 3.14 container, LWA response-streaming)
      # NOTE: No FunctionUrlConfig — streaming is wired via API GW, not
      # Function URLs. AWS_LWA_INVOKE_MODE controls the LWA sidecar
      # behavior; it is NOT FunctionUrlConfig.InvokeMode.
      Environment:
        Variables:
          # ---- LWA streaming knobs ----------------------------------------
          # Tells LWA to use the streaming Lambda Runtime API endpoint.
          AWS_LWA_INVOKE_MODE: response_stream
          # Port the Falcon/uvicorn app binds on inside the container.
          AWS_LWA_PORT: "8080"
          # LWA readiness probe path — must return 2xx before invocations.
          AWS_LWA_READINESS_CHECK_PATH: /status
          # ---- Mailbox app config -----------------------------------------
          MAILBOX_NAME: !Ref MailboxName
          MAILBOX_ALIAS: !Ref MailboxAlias
          MAILBOX_BASER_TABLE: !Ref MailboxBaserTable
          MAILBOX_KEEPER_TABLE: !Ref MailboxKeeperTable
          MAILBOX_SALT: !Ref MailboxSalt
          MAILBOX_REGION: !Ref AWS::Region
          MAILBOX_ENDPOINT_URL: ""
          MAILBOX_URL: !Sub "https://${DomainName}"
          WITNESS_AID: !Ref WitnessAid
          WITNESS_URL: !Ref WitnessUrl
          # libsodium .so lives under /var/task/lib (copied in Dockerfile)
          LD_LIBRARY_PATH: /var/task/lib
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MailboxBaserTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MailboxKeeperTable
      # Events: causes SAM to auto-generate Deployment + Stage + Permission
      # against MailboxApi.  We enumerate every path/method the Falcon app
      # serves explicitly so SAM generates the invoke permissions correctly.
      Events:
        PostRoot:
          Type: Api
          Properties:
            RestApiId: !Ref MailboxApi
            Path: /
            Method: post
        PutRoot:
          Type: Api
          Properties:
            RestApiId: !Ref MailboxApi
            Path: /
            Method: put
        GetRoot:
          Type: Api
          Properties:
            RestApiId: !Ref MailboxApi
            Path: /
            Method: get
        GetOobi:
          Type: Api
          Properties:
            RestApiId: !Ref MailboxApi
            Path: /oobi
            Method: get
        GetOobiAid:
          Type: Api
          Properties:
            RestApiId: !Ref MailboxApi
            Path: /oobi/{aid}
            Method: get
        GetOobiRole:
          Type: Api
          Properties:
            RestApiId: !Ref MailboxApi
            Path: /oobi/{aid}/{role}
            Method: get
        GetOobiEid:
          Type: Api
          Properties:
            RestApiId: !Ref MailboxApi
            Path: /oobi/{aid}/{role}/{eid}
            Method: get
    Metadata:
      Dockerfile: sam-mailbox/Dockerfile
      DockerContext: ../
      DockerTag: latest

  # -----------------------------------------------------------------------
  # Custom domain (ACM + API GW domain name + Route53)
  # -----------------------------------------------------------------------

  # ACM certificate for custom domain (DNS validated via Route53)
  MailboxCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # API Gateway custom domain (Regional — required for streaming idle timeout)
  MailboxApiDomainName:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Ref DomainName
      RegionalCertificateArn: !Ref MailboxCertificate
      EndpointConfiguration:
        Types:
          - REGIONAL

  # Base path mapping: ties the custom domain to the explicit MailboxApi
  # resource (not the implicit ServerlessRestApi).
  MailboxBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Properties:
      DomainName: !Ref MailboxApiDomainName
      RestApiId: !Ref MailboxApi
      Stage: Prod

  # Route53 A-alias record pointing the custom domain at the regional API GW
  MailboxDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt MailboxApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt MailboxApiDomainName.RegionalHostedZoneId

Outputs:
  MailboxUrl:
    Description: Custom domain URL for the mailbox
    Value: !Sub "https://${DomainName}"
  MailboxApiGw:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${MailboxApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  MailboxPre:
    Description: Mailbox prefix (AID) - GET / after deploy to retrieve
    Value: "Deploy, then GET / to retrieve the mailbox AID"
  MailboxBaserTableName:
    Description: DynamoDB Baser table name
    Value: !Ref MailboxBaserTable
  MailboxKeeperTableName:
    Description: DynamoDB Keeper table name
    Value: !Ref MailboxKeeperTable
