AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  KERI Mailbox Service - Serverless mailbox running on AWS Lambda + DynamoDB.
  Accepts /fwd exn deposits, serves qry r=/mbx polls as SSE long-poll via
  API Gateway response streaming. Uses a container image (Python 3.14+).
  All operator-specific values (DomainName, HostedZoneId, WitnessAid, etc.)
  are deploy-time parameters with no defaults — pass via --parameter-overrides.

Globals:
  Function:
    Timeout: 870           # under the 15-min streaming hard cap (900s)
    MemorySize: 1024
    Architectures:
      - arm64
  # Globals.Api dropped — we use explicit AWS::ApiGateway::RestApi
  # (MailboxApi) rather than AWS::Serverless::Api, so SAM's Globals.Api
  # section no longer applies. REGIONAL endpoint and BinaryMediaTypes
  # are set directly on MailboxApi.

Parameters:
  MailboxName:
    Type: String
    Default: mailbox
    Description: Base name for mailbox databases and resources
  MailboxAlias:
    Type: String
    Default: mailbox
    Description: Alias for the mailbox Hab
  DomainName:
    Type: String
    Description: Custom domain name for the mailbox API (e.g. mailbox.example.com — operator-owned)
    AllowedPattern: '^[a-zA-Z0-9.-]+$'
  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID for DomainName (must be created out-of-band)
    AllowedPattern: '^Z[A-Z0-9]+$'
  WitnessAid:
    Type: String
    Description: AID of the witness for this mailbox (currently informational only — see Phase 0 spec)
    Default: ""
  WitnessUrl:
    Type: String
    Description: Base URL of the witness service (currently informational only)
    Default: ""

Resources:
  # -----------------------------------------------------------------------
  # DynamoDB tables
  # -----------------------------------------------------------------------

  # DynamoDB table for Baser + Mailboxer (shared - non-overlapping subkeys)
  MailboxBaserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${MailboxName}-db"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: gsi_pk
          AttributeType: S
        - AttributeName: gsi_sk
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: subdb-index
          KeySchema:
            - AttributeName: gsi_pk
              KeyType: HASH
            - AttributeName: gsi_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Keeper is NOT a DynamoDB table — it lives in one KMS-encrypted Secrets
  # Manager secret per stack (keri/${AWS::StackName}/keeper), get-or-created
  # by the handler on first cold start. Salt+bran live inside that secret and
  # the keeper key material is aeid-encrypted. See MailboxFunction policies.

  # -----------------------------------------------------------------------
  # API Gateway — explicit resources (Approach B from Phase 0).
  #
  # The OpenAPI DefinitionBody path (Approach A) does not support the
  # responseTransferMode property in x-amazon-apigateway-integration —
  # API GW rejected "responseTransferMode: STREAMING" as "Invalid
  # ResponseTransferMode specified" during the first deploy attempt.
  #
  # Explicit AWS::ApiGateway::Method.Integration.ResponseTransferMode
  # is the only currently-working path for response-streaming REST APIs.
  # -----------------------------------------------------------------------

  MailboxApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${MailboxName}-api"
      EndpointConfiguration:
        Types:
          - REGIONAL
      BinaryMediaTypes:
        - application/cesr
        - "*/*"

  # /{proxy+} catch-all (root resource is implicit on the RestApi)
  MailboxProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MailboxApi
      ParentId: !GetAtt MailboxApi.RootResourceId
      PathPart: "{proxy+}"

  # ANY method on root — streaming aws_proxy integration
  MailboxRootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MailboxApi
      ResourceId: !GetAtt MailboxApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${MailboxFunction.Arn}/response-streaming-invocations"
        # CRITICAL: must be STREAMING when the URI is /response-streaming-invocations.
        ResponseTransferMode: STREAM
        PassthroughBehavior: WHEN_NO_MATCH

  # ANY method on /{proxy+} — same streaming integration
  MailboxProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MailboxApi
      ResourceId: !Ref MailboxProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${MailboxFunction.Arn}/response-streaming-invocations"
        ResponseTransferMode: STREAM
        PassthroughBehavior: WHEN_NO_MATCH

  # Deployment — depends on the methods so CFN orders correctly
  MailboxApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - MailboxRootMethod
      - MailboxProxyMethod
    Properties:
      RestApiId: !Ref MailboxApi

  # Stage — explicit Prod stage
  MailboxApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref MailboxApi
      DeploymentId: !Ref MailboxApiDeployment
      StageName: Prod

  # Lambda invoke permission for the API GW stage
  MailboxFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MailboxFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MailboxApi}/*/*/*"

  # -----------------------------------------------------------------------
  # Lambda function (ARM64 container image, LWA streaming)
  # -----------------------------------------------------------------------

  MailboxFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${MailboxName}-handler"
      PackageType: Image
      ImageUri: !Sub "${MailboxName}-handler:latest"
      Description: KERI Mailbox Lambda handler (Python 3.14 container, LWA response-streaming)
      # NOTE: No FunctionUrlConfig — streaming is wired via API GW, not
      # Function URLs. AWS_LWA_INVOKE_MODE controls the LWA sidecar
      # behavior; it is NOT FunctionUrlConfig.InvokeMode.
      Environment:
        Variables:
          # ---- LWA streaming knobs ----------------------------------------
          # Tells LWA to use the streaming Lambda Runtime API endpoint.
          AWS_LWA_INVOKE_MODE: response_stream
          # Port the Falcon/uvicorn app binds on inside the container.
          AWS_LWA_PORT: "8080"
          # LWA readiness probe path — must return 2xx before invocations.
          AWS_LWA_READINESS_CHECK_PATH: /status
          # ---- Mailbox app config -----------------------------------------
          MAILBOX_NAME: !Ref MailboxName
          MAILBOX_ALIAS: !Ref MailboxAlias
          MAILBOX_BASER_TABLE: !Ref MailboxBaserTable
          MAILBOX_KEEPER_SECRET: !Sub "keri/${AWS::StackName}/keeper"
          MAILBOX_REGION: !Ref AWS::Region
          MAILBOX_ENDPOINT_URL: ""
          MAILBOX_URL: !Sub "https://${DomainName}"
          WITNESS_AID: !Ref WitnessAid
          WITNESS_URL: !Ref WitnessUrl
          # libsodium .so lives under /var/task/lib (copied in Dockerfile)
          LD_LIBRARY_PATH: /var/task/lib
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MailboxBaserTable
        # The handler get-or-creates and reads/writes the keeper secret
        # (keri/<stack>/keeper) on cold start, so it needs Create/Put as well
        # as Get. Scoped to this stack's own keri/<stack>/* secrets. No
        # DescribeSecret — SecretStore never calls it (least-privilege).
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:CreateSecret
                - secretsmanager:PutSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:keri/${AWS::StackName}/*"
      # No Events: block — API GW routes are wired via explicit
      # MailboxRootMethod and MailboxProxyMethod resources above, and
      # invoke permission is granted via MailboxFunctionPermission.
    Metadata:
      Dockerfile: sam-mailbox/Dockerfile
      DockerContext: ../
      DockerTag: latest

  # -----------------------------------------------------------------------
  # Custom domain (ACM + API GW domain name + Route53)
  # -----------------------------------------------------------------------

  # ACM certificate for custom domain (DNS validated via Route53)
  MailboxCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # API Gateway custom domain (Regional — required for streaming idle timeout)
  MailboxApiDomainName:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Ref DomainName
      RegionalCertificateArn: !Ref MailboxCertificate
      EndpointConfiguration:
        Types:
          - REGIONAL

  # Base path mapping: ties the custom domain to MailboxApi/Prod.
  MailboxBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    DependsOn:
      - MailboxApiStage
    Properties:
      DomainName: !Ref MailboxApiDomainName
      RestApiId: !Ref MailboxApi
      Stage: Prod

  # Route53 A-alias record pointing the custom domain at the regional API GW
  MailboxDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt MailboxApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt MailboxApiDomainName.RegionalHostedZoneId

Outputs:
  MailboxUrl:
    Description: Custom domain URL for the mailbox
    Value: !Sub "https://${DomainName}"
  MailboxApiGw:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${MailboxApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  MailboxPre:
    Description: Mailbox prefix (AID) - GET / after deploy to retrieve
    Value: "Deploy, then GET / to retrieve the mailbox AID"
  MailboxBaserTableName:
    Description: DynamoDB Baser table name
    Value: !Ref MailboxBaserTable
  MailboxKeeperSecret:
    Description: Secrets Manager secret holding the keeper (salt+bran+keystore)
    Value: !Sub "keri/${AWS::StackName}/keeper"
