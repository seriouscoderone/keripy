AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  KERI Witness Service - Serverless witness running on AWS Lambda + DynamoDB.
  Receives key events, validates via Kevery, produces receipts, stores KEL,
  and serves OOBI endpoints. Uses a container image (Python 3.14+).

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024
    Architectures:
      - arm64
  Api:
    BinaryMediaTypes:
      - application/cesr
      - "*/*"

Parameters:
  WitnessName:
    Type: String
    Default: witness
    Description: Base name for witness databases and resources
  WitnessAlias:
    Type: String
    Default: witness
    Description: Alias for the witness Hab
  DomainName:
    Type: String
    Description: Custom domain name for the witness API (e.g. witness.example.com — operator-owned)
    AllowedPattern: '^[a-zA-Z0-9.-]+$'
  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID for DomainName (must be created out-of-band)
    AllowedPattern: '^Z[A-Z0-9]+$'

Resources:
  # DynamoDB table for Baser (KEL events, escrows, state, reger, mailboxer)
  WitnessBaserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${WitnessName}-db"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: gsi_pk
          AttributeType: S
        - AttributeName: gsi_sk
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: subdb-index
          KeySchema:
            - AttributeName: gsi_pk
              KeyType: HASH
            - AttributeName: gsi_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Keeper is NOT a DynamoDB table — it lives in one KMS-encrypted Secrets
  # Manager secret per stack (keri/${AWS::StackName}/keeper), get-or-created
  # by the handler on first cold start. Salt+bran live inside that secret and
  # the keeper key material is aeid-encrypted. See WitnessFunction policies.

  # Lambda function (container image with Python 3.14)
  WitnessFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${WitnessName}-handler"
      PackageType: Image
      ImageUri: !Sub "${WitnessName}-handler:latest"
      Description: KERI Witness Lambda handler (Python 3.14 container)
      Environment:
        Variables:
          WITNESS_NAME: !Ref WitnessName
          WITNESS_ALIAS: !Ref WitnessAlias
          WITNESS_BASER_TABLE: !Ref WitnessBaserTable
          WITNESS_KEEPER_SECRET: !Sub "keri/${AWS::StackName}/keeper"
          WITNESS_REGION: !Ref AWS::Region
          WITNESS_ENDPOINT_URL: ""
          WITNESS_URL: !Sub "https://${DomainName}"
          LD_LIBRARY_PATH: /var/task/lib
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WitnessBaserTable
        # The handler get-or-creates and reads/writes the keeper secret
        # (keri/<stack>/keeper) on cold start, so it needs Create/Put as well
        # as Get/Describe. Scoped to this stack's own keri/<stack>/* secrets.
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
                - secretsmanager:CreateSecret
                - secretsmanager:PutSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:keri/${AWS::StackName}/*"
      Events:
        PostRoot:
          Type: Api
          Properties:
            Path: /
            Method: post
        PutRoot:
          Type: Api
          Properties:
            Path: /
            Method: put
        GetRoot:
          Type: Api
          Properties:
            Path: /
            Method: get
        PostReceipts:
          Type: Api
          Properties:
            Path: /receipts
            Method: post
        GetReceipts:
          Type: Api
          Properties:
            Path: /receipts
            Method: get
        GetQuery:
          Type: Api
          Properties:
            Path: /query
            Method: get
        GetOobi:
          Type: Api
          Properties:
            Path: /oobi
            Method: get
        GetOobiAid:
          Type: Api
          Properties:
            Path: /oobi/{aid}
            Method: get
        GetOobiRole:
          Type: Api
          Properties:
            Path: /oobi/{aid}/{role}
            Method: get
        GetOobiEid:
          Type: Api
          Properties:
            Path: /oobi/{aid}/{role}/{eid}
            Method: get
    Metadata:
      Dockerfile: sam-witness/Dockerfile
      DockerContext: ../
      DockerTag: latest

  # ACM certificate for custom domain
  WitnessCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # API Gateway custom domain
  WitnessApiDomainName:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Ref DomainName
      RegionalCertificateArn: !Ref WitnessCertificate
      EndpointConfiguration:
        Types:
          - REGIONAL

  # Base path mapping. DependsOn the SAM-implicit Prod stage so the
  # mapping doesn't race the stage creation on a from-scratch deploy
  # (without this, CFN reports "Invalid stage identifier specified").
  WitnessBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    DependsOn: ServerlessRestApiProdStage
    Properties:
      DomainName: !Ref WitnessApiDomainName
      RestApiId: !Ref ServerlessRestApi
      Stage: Prod

  # Route53 DNS record
  WitnessDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt WitnessApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt WitnessApiDomainName.RegionalHostedZoneId

Outputs:
  WitnessUrl:
    Description: Custom domain URL for the witness
    Value: !Sub "https://${DomainName}"
  WitnessApiGw:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  WitnessPre:
    Description: Witness prefix (AID) - GET / after deploy to retrieve
    Value: "Deploy, then GET / to retrieve the witness AID"
  WitnessBaserTableName:
    Description: DynamoDB Baser table name
    Value: !Ref WitnessBaserTable
  WitnessKeeperSecret:
    Description: Secrets Manager secret holding the keeper (salt+bran+keystore)
    Value: !Sub "keri/${AWS::StackName}/keeper"
